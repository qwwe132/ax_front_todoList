<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO 리스트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 id="formTitle">할일 등록</h1>
  </header>

  <main class="container">
    <!-- 추가 / 수정 폼 -->
    <form id="todoForm" class="todo-form">
      <div class="form-row">
        <label for="dateInput">날짜</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-row">
        <label for="titleInput">제목</label>
        <input type="text" id="titleInput" placeholder="제목 입력" maxlength="50" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="contentInput">내용</label>
        <textarea id="contentInput" placeholder="내용 입력" rows="3"></textarea>
      </div>
      <div class="form-buttons">
        <button type="submit" id="submitBtn" class="btn btn-submit">등록하기</button>
        <button type="button" id="cancelBtn" class="btn btn-cancel" hidden>취소</button>
      </div>
    </form>

    <!-- 조회: todo.js가 카드를 채워 넣음 -->
    <ul id="todoList" class="todo-list"></ul>
    <p id="emptyMessage" class="empty">등록된 할 일이 없습니다.</p>
  </main>

  <script src="js/todo.js"></script>
</body>
</html>
